<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>La Grille des Potes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f19;
  --card: #131b2e;
  --card-hover: #1a2540;
  --border: #22304f;
  --text: #ffffff;
  --text-muted: #94a3b8;
  --primary: #10b981;
  --primary-glow: rgba(16, 185, 129, 0.4);
  --primary-text: #042f1c;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  padding: 24px 16px 100px;
}

.wrap { max-width: 600px; margin: 0 auto; }

header {
  text-align: center;
  margin-bottom: 24px;
}

.kicker {
  display: inline-block;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: #34d399;
  background: rgba(16, 185, 129, 0.15);
  padding: 6px 14px;
  border-radius: 20px;
  margin-bottom: 10px;
}

h1 {
  font-family: 'Outfit', sans-serif;
  font-size: 36px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
  color: #fff;
}

.daylabel {
  font-size: 15px;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: capitalize;
  margin: 0;
}

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  background: var(--card);
  padding: 6px;
  border-radius: 14px;
  border: 1px solid var(--border);
  margin-bottom: 20px;
}

.tab {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 12px;
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  font-size: 14px;
  text-transform: uppercase;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
}

.tab[aria-selected="true"] {
  background: var(--primary);
  color: var(--primary-text);
  box-shadow: 0 0 20px var(--primary-glow);
}

.me {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 20px;
}

label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-bottom: 6px;
}

input, textarea {
  width: 100%;
  background: #070a12;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px;
  border-radius: 10px;
  font-family: inherit;
  font-size: 15px;
  outline: none;
}
input:focus, textarea:focus { border-color: var(--primary); }

.note {
  background: rgba(59, 130, 246, 0.15);
  border: 1px solid rgba(59, 130, 246, 0.3);
  color: #93c5fd;
  padding: 12px;
  border-radius: 12px;
  font-size: 13px;
  margin-bottom: 16px;
  text-align: center;
  font-weight: 600;
}

.list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.list > li {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.2s;
}

.list > li.grp {
  background: transparent;
  border: none;
  padding: 6px 0 2px;
  font-family: 'Outfit', sans-serif;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.1em;
  color: var(--primary);
  text-transform: uppercase;
}

/* En-tête cliquable du match (compact) */
.match-summary {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  background: var(--card);
  user-select: none;
}
.match-summary:hover {
  background: var(--card-hover);
}

.match-info-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
}

.time {
  font-size: 11px;
  font-weight: 700;
  background: #070a12;
  padding: 3px 6px;
  border-radius: 4px;
  color: var(--text-muted);
}

.teams-mini {
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
}

.match-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.badge-pick {
  font-size: 10px;
  font-weight: 800;
  background: rgba(16, 185, 129, 0.2);
  color: #34d399;
  padding: 3px 8px;
  border-radius: 6px;
}

.arrow {
  font-size: 12px;
  color: var(--text-muted);
  transition: transform 0.2s;
}
.list > li.open .arrow {
  transform: rotate(180deg);
}

/* Contenu détaillé (déplié au clic) */
.match-details {
  display: none;
  padding: 0 16px 16px;
  border-top: 1px solid var(--border);
  background: #0d1322;
}
.list > li.open .match-details {
  display: block;
}

.teams-full {
  font-family: 'Outfit', sans-serif;
  font-size: 16px;
  font-weight: 800;
  text-align: center;
  margin: 12px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.teams-full span:not(.vs) { flex: 1; }
.teams-full span:first-child { text-align: right; }
.teams-full span:last-child { text-align: left; }
.teams-full .vs {
  font-size: 9px;
  color: var(--text-muted);
  background: #070a12;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

/* Boutons de cotes plus petits et compacts */
.slips {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}

.slip {
  background: #070a12;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  color: var(--text);
  transition: all 0.15s;
}

.slip b {
  font-family: 'Outfit', sans-serif;
  font-size: 15px;
  font-weight: 900;
}

.slip small {
  font-size: 9px;
  color: var(--text-muted);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.slip .odd {
  font-size: 10px;
  font-weight: 700;
  color: #34d399;
  margin-top: 1px;
}

.slip.on {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-text);
  box-shadow: 0 0 10px var(--primary-glow);
}
.slip.on small, .slip.on .odd {
  color: var(--primary-text);
  font-weight: 800;
}

.totals-section {
  border-top: 1px dashed var(--border);
  padding-top: 8px;
  margin-top: 6px;
}
.totals-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 4px;
  text-align: center;
}
.totals-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-bottom: 4px;
}

.send {
  margin-top: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 16px;
  border-radius: 14px;
  display: grid;
  gap: 12px;
}

.row { display: flex; gap: 8px; }

.btn {
  flex: 1;
  min-height: 48px;
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  font-size: 13px;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  border: 1px solid var(--border);
  background: #22304f;
  color: #fff;
}

.btn.primary {
  background: var(--primary);
  color: var(--primary-text);
  border-color: var(--primary);
  box-shadow: 0 4px 15px var(--primary-glow);
}

.preview {
  background: #070a12;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  font-size: 12px;
  color: var(--text-muted);
  white-space: pre-wrap;
  margin: 0;
}

.hint { font-size: 12px; font-weight: 600; color: var(--text-muted); margin: 0; }

.empty {
  text-align: center;
  padding: 30px;
  border: 2px dashed var(--border);
  border-radius: 14px;
  color: var(--text-muted);
}
.empty h2 { font-family: 'Outfit'; color: #fff; font-size: 18px; margin: 0 0 4px; }

#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #fff;
  color: #000;
  padding: 10px 18px;
  border-radius: 20px;
  font-weight: 800;
  font-size: 13px;
  z-index: 100;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="kicker">Pronos entre potes</div>
    <h1>La Grille du Jour</h1>
    <p class="daylabel" id="daylabel"></p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" type="button" id="tab-grille" data-tab="grille">Ma Grille</button>
    <button class="tab" role="tab" type="button" id="tab-synthese" data-tab="synthese">Synthèse (Ahmed)</button>
  </nav>

  <main id="view"></main>
  <div id="toast" role="status" hidden></div>
</div>

<script>
(function(){
  var TZ='Europe/Paris';
  var DAY=__DAY_JSON__;
  var PHONE='__PHONE__';

  function $(id){return document.getElementById(id);}
  function h(tag,attrs){
    var e=document.createElement(tag);
    attrs=attrs||{};
    for(var k in attrs){
      var v=attrs[k];
      if(v==null||v===false)continue;
      if(k==='class')e.className=v;
      else if(k==='text')e.textContent=v;
      else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
      else e.setAttribute(k,v===true?'':v);
    }
    for(var i=2;i<arguments.length;i++){
      var c=arguments[i];
      var list=Array.isArray(c)?c:[c];
      for(var j=0;j<list.length;j++){
        var x=list[j];
        if(x==null||x===false)continue;
        e.append(x.nodeType?x:document.createTextNode(String(x)));
      }
    }
    return e;
  }
  function parisNow(){
    var parts=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
    function g(t){for(var i=0;i<parts.length;i++){if(parts[i].type===t)return parts[i].value;}return '';}
    return {day:g('year')+'-'+g('month')+'-'+g('day'),hm:g('hour')+':'+g('minute')};
  }
  function dayLabel(d){return new Date(d+'T12:00:00Z').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});}

  var S={tab:'grille',name:'',picks:{},pasted:''};
  var toastTimer=null;
  function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},4000);}

  function load(){
    try{
      S.name=localStorage.getItem('grille-nom')||'';
      var r=localStorage.getItem('grille-'+DAY.date);
      if(r){var o=JSON.parse(r);S.picks=o&&o.picks?o.picks:{};}
      S.pasted=localStorage.getItem('grille-collage-'+DAY.date)||'';
    }catch(e){}
  }
  function save(){
    try{
      localStorage.setItem('grille-nom',S.name);
      localStorage.setItem('grille-'+DAY.date,JSON.stringify({picks:S.picks}));
    }catch(e){}
  }

  function locked(m){
    var n=parisNow();
    if(DAY.date<n.day)return true;
    if(DAY.date===n.day&&m.t&&m.t<=n.hm)return true;
    return false;
  }

  function message(){
    var lines=['GRILLE '+DAY.date+' | '+(S.name||'').trim()];
    DAY.matches.forEach(function(m,i){
      var p=S.picks[i];
      if(p) {
        var labelChoice = p;
        if(p.startsWith('OVER_')) labelChoice = 'Plus de ' + p.split('_')[1] + ' buts';
        if(p.startsWith('UNDER_')) labelChoice = 'Moins de ' + p.split('_')[1] + ' buts';
        lines.push((i+1)+') '+m.h+' – '+m.a+' : '+labelChoice);
      }
    });
    return lines.join('\n');
  }
  function nbPicks(){var n=0;DAY.matches.forEach(function(m,i){if(S.picks[i])n++;});return n;}
  function ready(){return nbPicks()>0&&(S.name||'').trim().length>0;}

  async function copyText(txt,okMsg){
    try{await navigator.clipboard.writeText(txt);toast(okMsg);return true;}catch(e){return false;}
  }

  function updateSend(){
    var box=$('send');
    if(!box)return;
    var msg=message();
    $('preview').textContent=ready()?msg:'Entre ton prénom et coche au moins un pronostic.';
    var a=$('wa');
    a.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg);
    a.setAttribute('aria-disabled',ready()?'false':'true');
    $('count').textContent=nbPicks()+' / '+DAY.matches.length+' pronos sélectionnés';
  }

  function grilleView(){
    var out=[];
    if(DAY.updated)out.push(h('div',{class:'note',text:'Cotes Betclic relevées à '+DAY.updated+' (Paris).'}));
    var nick=h('input',{id:'nick',maxlength:'24',placeholder:'Ex. Karim'});
    nick.value=S.name;
    nick.addEventListener('input',function(){S.name=nick.value;save();updateSend();});
    out.push(h('div',{class:'me'},h('label',{for:'nick',text:'Ton prénom'}),nick));

    if(!DAY.matches.length){out.push(h('div',{class:'empty'},h('h2',{text:'Aucun match'}),h('p',{text:'Reviens plus tard pour la nouvelle grille.'})));return out;}

    var items=[];var lastComp=null;
    DAY.matches.forEach(function(m,i){
      var lock=locked(m),mine=S.picks[i];
      var labels={'1':m.h,'N':'Nul','2':m.a};
      
      // Résumé miniature affiché avant l'ouverture
      var pickBadgeText = mine ? (mine.startsWith('OVER_') ? '+'+mine.split('_')[1] : mine.startsWith('UNDER_') ? '-'+mine.split('_')[1] : mine) : '';
      var rightSideMini = h('div',{class:'match-right'},
        pickBadgeText ? h('span',{class:'badge-pick',text:pickBadgeText}) : null,
        locked(m)?h('span',{class:'pill',text:'Fermé'}):null,
        h('span',{class:'arrow',text:'▼'})
      );

      var summaryEl = h('div',{class:'match-summary',onclick:function(e){
        // Basculer l'ouverture de la carte
        liEl.classList.toggle('open');
      }},
        h('div',{class:'match-info-left'},
          h('span',{class:'time',text:m.t||'--:--'}),
          h('span',{class:'teams-mini',text:m.h + ' – ' + m.a})
        ),
        rightSideMini
      );

      // Boutons 1N2 détaillés
      var h2hKeys=['1','N','2'];
      var btns1N2=h2hKeys.map(function(v, idx){
        return h('button',{type:'button',class:'slip'+(mine===v?' on':''),disabled:lock?true:null,
          onclick:function(){
            if(S.picks[i]===v)delete S.picks[i];else S.picks[i]=v;
            save();renderView();
          }},h('b',{text:v}),h('small',{text:labels[v]}),(m.o&&m.o[idx]!=null)?h('span',{class:'odd',text:Number(m.o[idx]).toFixed(2)}):null);
      });

      // Blocs dynamiques Over/Under détaillés
      var totalsBlock = null;
      if(m.totals && Object.keys(m.totals).length > 0) {
        var totalsRows = [];
        var points = Object.keys(m.totals).sort(function(a,b){return Number(a)-Number(b);});
        
        points.forEach(function(pt){
          var lineData = m.totals[pt];
          var overKey = 'OVER_' + pt;
          var underKey = 'UNDER_' + pt;

          var overBtn = h('button',{type:'button',class:'slip'+(mine===overKey?' on':''),disabled:lock?true:null,
            onclick:function(){
              if(S.picks[i]===overKey)delete S.picks[i];else S.picks[i]=overKey;
              save();renderView();
            }},h('b',{text:'+' + pt}),h('small',{text:'Plus de ' + pt}),lineData.over != null ? h('span',{class:'odd',text:Number(lineData.over).toFixed(2)}) : null);

          var underBtn = h('button',{type:'button',class:'slip'+(mine===underKey?' on':''),disabled:lock?true:null,
            onclick:function(){
              if(S.picks[i]===underKey)delete S.picks[i];else S.picks[i]=underKey;
              save();renderView();
            }},h('b',{text:'-' + pt}),h('small',{text:'Moins de ' + pt}),lineData.under != null ? h('span',{class:'odd',text:Number(lineData.under).toFixed(2)}) : null);

          totalsRows.push(h('div',{class:'totals-row'}, overBtn, underBtn));
        });

        totalsBlock = h('div',{class:'totals-section'},
          h('div',{class:'totals-label'},'Nombre de buts (Over / Under)'),
          totalsRows
        );
      }

      var detailsEl = h('div',{class:'match-details'},
        h('div',{class:'teams-full'},h('span',{text:m.h}),h('span',{class:'vs',text:'VS'}),h('span',{text:m.a})),
        h('div',{class:'slips'},btns1N2),
        totalsBlock
      );

      if(m.c!==lastComp){items.push(h('li',{class:'grp',text:m.c||'Autres'}));lastComp=m.c;}
      
      var liEl = h('li',null, summaryEl, detailsEl);
      items.push(liEl);
    });
    out.push(h('ul',{class:'list'},items));

    var wa=h('a',{id:'wa',class:'btn primary',href:'#',target:'_blank',rel:'noopener',onclick:function(e){
      if(!ready()){e.preventDefault();toast('Renseigne ton prénom et au moins un pronostic.');}
    }},'Envoyer sur WhatsApp');
    var cp=h('button',{type:'button',class:'btn',onclick:async function(){
      if(!ready()){toast('Renseigne ton prénom et au moins un pronostic.');return;}
      await copyText(message(),'Copié ! Tu peux le coller à Ahmed.');
    }},'Copier le texte');

    out.push(h('section',{class:'send',id:'send'},
      h('p',{class:'hint',id:'count'}),
      h('div',{class:'row'},wa,cp),
      h('pre',{class:'preview',id:'preview'})));
    return out;
  }

  function renderView(){
    var v=$('view');
    v.replaceChildren.apply(v,S.tab==='synthese'?[]:grilleView());
    updateSend();
  }
  function renderTabs(){
    ['grille','synthese'].forEach(function(k){$('tab-'+k).setAttribute('aria-selected',S.tab===k?'true':'false');});
  }

  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click',function(){
      S.tab=b.getAttribute('data-tab');
      try{location.hash=S.tab;}catch(e){}
      renderTabs();renderView();
    });
  });

  load();
  if(location.hash==='#grille'||location.hash==='#synthese')S.tab=location.hash.slice(1);
  $('daylabel')->textContent=dayLabel(DAY.date);
  renderTabs();
  renderView();
})();
</script>
</body>
</html>
